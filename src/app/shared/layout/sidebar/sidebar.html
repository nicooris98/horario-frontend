<nav
  id="primary-navigation"
  class="sidebar"
  [class.open]="sidebarOpen()"
  aria-label="Navegación principal"
>
  <div class="sidebar-content">
    <div class="sidebar-brand">
      <i class="pi pi-graduation-cap" aria-hidden="true"></i>
      <span>
        <strong>SAHD</strong>
        <small>Sistema de Administración de Horarios Docentes</small>
      </span>
    </div>

    <div class="sidebar-navigation">
      <span class="sidebar-section-title">Navegación</span>
      <p-panelmenu [model]="navigationItems" [multiple]="true" [dt]="panelMenuTheme" />
      <div class="degree-menu-wrap">
        <p-panelmenu [model]="degreeMenuItems" [multiple]="true" [dt]="panelMenuTheme" styleClass="degree-menu" />
      </div>
    </div>

    <div class="sidebar-administration">
      <p-panelmenu [model]="administrationItems" [multiple]="true" [dt]="panelMenuTheme" />
    </div>

    <div class="sidebar-bottom">
      <p-button
        label="Cerrar sesión"
        icon="pi pi-sign-out"
        severity="secondary"
        variant="text"
        fluid
        [dt]="sidebarButtonTheme"
        (onClick)="confirmarCerrarSesion()"
      />
    </div>
  </div>
</nav>

<p-confirmdialog />
