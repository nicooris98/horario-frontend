<section aria-labelledby="subject-detail-title">
  <p-breadcrumb [model]="breadcrumbItems()" [home]="breadcrumbHome" styleClass="page-breadcrumb" />

  <app-detail-header
    headingId="subject-detail-title"
    title="Detalle de la materia"
    [recordName]="subject()?.name ?? 'Cargando...'"
    [statusLabel]="subject() ? statusLabel(subject()!) : null"
    [statusSeverity]="subject() ? statusSeverity(subject()!) : 'secondary'"
    editLabel="Editar materia"
    [showEdit]="!!(subject() && canUpdate())"
    (back)="goBack()"
    (edit)="goToEdit()"
  />

  @if (errorMessage()) {
    <p-message class="detail-error" severity="error" role="alert">
      {{ errorMessage() }}
    </p-message>
  }

  @if (subject(); as current) {
    <p-card styleClass="detail-highlights">
      <ul class="highlights">
        @for (item of highlights(); track item.label) {
          <li class="highlight">
            <span class="highlight-icon" aria-hidden="true"><i [class]="item.icon"></i></span>
            <span>
              <strong class="highlight-value">{{ item.value }}</strong>
              <span class="highlight-label">{{ item.label }}</span>
            </span>
          </li>
        }
      </ul>
    </p-card>

    <p-card>
      <h2 class="detail-section-title">
        <i class="pi pi-file" aria-hidden="true"></i>
        Información de la materia
      </h2>

      <dl class="detail-list">
        @for (row of rows(); track row.label) {
          <div class="detail-row">
            <dt>{{ row.label }}</dt>
            <dd>{{ row.value }}</dd>
          </div>
        }
        <div class="detail-row">
          <dt>Estado</dt>
          <dd>
            <p-tag
              icon="pi pi-circle-fill"
              [value]="statusLabel(current)"
              [severity]="statusSeverity(current)"
              [rounded]="true"
            />
          </dd>
        </div>
      </dl>
    </p-card>
  }
</section>
